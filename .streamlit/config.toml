[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121A2B"
textColor = "#E8EEF7"
# Streamlit only allows sans-serif | serif | monospace here; distinctive faces
# are loaded via dashboard_theme.inject_theme() (Sora + IBM Plex Mono).
font = "sans serif"
